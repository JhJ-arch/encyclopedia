        usage: "나라 안팎에서 일어난 중요한 사건, 날씨, 새로운 지식 등을 글과 사진으로 인쇄하여 매일 아침 많은 사람에게 알리는 대중 통신수단이에요. 오늘날에는 종이 신문뿐만 아니라 컴퓨터나 스마트폰으로 읽는 인터넷 신문도 많이 본답니다."
      },
      {
        name: "라디오",
        category: "통신수단",
        icon: "📻",
        keywords: ["라디오", "라디오방송"],
        period: "1895년 무선 전신이 발명된 뒤 1920년대부터 라디오 방송이 시작되었고, 우리나라는 1927년에 첫 라디오 방송을 시작했어요.",
        usage: "방송국에서 보내는 전파를 받아서 소리로 들려주는 대중 통신수단이에요. 화면은 없지만 음악, 뉴스, 일기예보, 재미있는 사연 등을 들려주어, 자동차를 운전하는 어른들이나 일하는 사람들이 귀로 소식을 들을 때 많이 사용한답니다."
      },
      {
        name: "텔레비전 (TV)",
        category: "통신수단",
        icon: "📺",
        keywords: ["텔레비전", "tv", "티비", "방송"],
        period: "1920년대에 기계식 텔레비전이 처음 발명되었고, 우리나라에서는 1956년에 첫 방송이 시작된 후 1970년대~1980년대에 각 가정으로 널리 보급되었어요.",
        usage: "방송국에서 보내는 소리와 움직이는 영상을 화면으로 동시에 보여주는 대중 통신수단이에요. 온 가족이 거실에 모여 실시간으로 뉴스, 일기예보, 스포츠 경기, 교육 방송 등을 보며 세상 소식을 생생하게 알 수 있답니다."
      }
    ];

    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultContainer = document.getElementById('resultContainer');

    function normalize(str) {
      return str.replace(/\s+/g, '').toLowerCase();
    }

    function findItem(rawQuery) {
      const q = normalize(rawQuery);
      if (!q) return null;

      for (const item of DB) {
        if (item.keywords.some(k => normalize(k) === q)) {
          return item;
        }
      }

      let bestMatch = null;
      let maxMatchedLen = 0;

      for (const item of DB) {
        for (const k of item.keywords) {
          const nk = normalize(k);
          if (q.includes(nk) && nk.length > maxMatchedLen) {
            bestMatch = item;
            maxMatchedLen = nk.length;
          } else if (q.length >= 2 && nk.includes(q) && q.length > maxMatchedLen) {
            bestMatch = item;
            maxMatchedLen = q.length;
          }
        }
      }

      return bestMatch;
    }

    function formatUsage(text) {
      return text
        .split('\n')
        .map(line => {
          const trimmed = line.trim();
          if (!trimmed) return '<div class="h-2"></div>';
          if (trimmed.startsWith('•')) {
            return `<div class="bg-amber-50/80 border border-amber-200 rounded-xl p-3.5 my-2 text-slate-800 leading-relaxed font-medium">${trimmed}</div>`;
          }
          return `<p class="leading-relaxed">${trimmed}</p>`;
        })
        .join('');
    }

    function renderResult(item) {
      const isTransport = item.category === '교통수단';
      const badgeColor = isTransport
        ? 'bg-emerald-100 text-emerald-700 border-emerald-200'
        : 'bg-purple-100 text-purple-700 border-purple-200';

      resultContainer.innerHTML = `
        <div class="card-enter bg-white rounded-3xl shadow-xl border-2 border-sky-100 overflow-hidden">
          <div class="bg-gradient-to-r from-sky-50 to-indigo-50 px-6 py-5 border-b border-sky-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="text-4xl">${item.icon}</span>
              <h2 class="title-font text-2xl sm:text-3xl text-slate-800">${item.name}</h2>
            </div>
            <span class="px-3.5 py-1 rounded-full text-sm font-bold border ${badgeColor}">
              ${item.category}
            </span>
          </div>

          <div class="p-6 sm:p-8 space-y-6">
            <div class="bg-sky-50/70 rounded-2xl p-5 border border-sky-100">
              <div class="flex items-center gap-2 text-sky-700 font-bold text-lg mb-2">
                <span>⏳</span>
                <span>1. 만들어진 시기</span>
              </div>
              <p class="text-slate-700 text-base sm:text-lg leading-relaxed">
                ${item.period}
              </p>
            </div>

            <div class="bg-amber-50/40 rounded-2xl p-5 border border-amber-100">
              <div class="flex items-center gap-2 text-amber-700 font-bold text-lg mb-2">
                <span>💡</span>
                <span>2. 사용 방법</span>
              </div>
              <div class="text-slate-700 text-base sm:text-lg">
                ${formatUsage(item.usage)}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderNotice() {
      resultContainer.innerHTML = `
        <div class="card-enter bg-white rounded-3xl shadow-lg border-2 border-rose-200 p-8 text-center">
          <div class="text-5xl mb-3">🤔</div>
          <h3 class="title-font text-2xl text-slate-800 mb-2">
            교통수단이나 통신수단을 검색해 주세요!
          </h3>
          <p class="text-slate-600 text-base sm:text-lg leading-relaxed">
            입력한 단어는 교통수단이나 통신수단 사전에서 찾을 수 없어요.<br>
            옛날과 오늘날 사람들이 이동할 때 타는 <strong>교통수단</strong>이나,<br>
            소식을 주고받을 때 쓰는 <strong>통신수단</strong>의 이름을 다시 입력해 보세요!
          </p>
        </div>
      `;
    }

    function handleSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      const matched = findItem(query);
      if (matched) {
        renderResult(matched);
      } else {
        renderNotice();
      }
    }

    // 검색 버튼 클릭 시 실행
    searchBtn.addEventListener('click', handleSearch);

    // 엔터 키 입력 시 실행 (새로고침 방지)
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSearch();
      }
    });
  </script>
</body>
</html>
